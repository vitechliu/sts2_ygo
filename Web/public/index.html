<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYgo 卡牌管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>VYgo 卡牌管理后台</h1>
            <nav>
                <button class="nav-btn active" data-tab="cards">卡牌管理</button>
                <button class="nav-btn" data-tab="library">卡牌列表</button>
                <button class="nav-btn" data-tab="config">配置中心</button>
            </nav>
        </header>

        <main>
            <!-- 卡牌管理模块 -->
            <section id="cards-tab" class="tab-content active">
                <div class="card-search">
                    <h2>导入卡牌</h2>
                    <div class="import-search-grid">
                        <div class="import-search-field">
                            <label for="cardIdInput">按卡牌 ID</label>
                            <div class="search-box">
                                <input type="text" id="cardIdInput" inputmode="numeric" placeholder="例如：70095154" />
                                <button type="button" id="queryBtn">查询</button>
                            </div>
                        </div>
                        <div class="import-search-field">
                            <label for="cardNameInput">按卡牌名</label>
                            <div class="search-box">
                                <input type="text" id="cardNameInput" placeholder="例如：电子龙" autocomplete="off" />
                                <button type="button" id="nameQueryBtn">搜索</button>
                            </div>
                        </div>
                    </div>
                    <div id="nameSearchResults" class="name-search-results hidden" aria-live="polite"></div>
                </div>

                <!-- 查询结果面板 -->
                <div id="queryResult" class="query-result hidden">
                    <div class="result-grid">
                        <!-- API 信息 -->
                        <div class="api-info-panel">
                            <h3>API 信息</h3>
                            <div id="apiInfoContent">
                                <p><strong>中文名：</strong> <span id="infoCnName">-</span></p>
                                <p><strong>英文名：</strong> <span id="infoEnName">-</span></p>
                                <p><strong>清洗后英文名：</strong> <span id="infoCleanEnName">-</span></p>
                                <p><strong>类型：</strong> <span id="infoTypes">-</span></p>
                                <p><strong>描述：</strong> <span id="infoDesc">-</span></p>
                                <p><strong>ATK/DEF：</strong> <span id="infoStats">-</span></p>
                            </div>
                            <div id="manualEnNameField" class="manual-en-name-field hidden">
                                <label for="manualEnNameInput">API 缺少英文名，请手动输入</label>
                                <input
                                    type="text"
                                    id="manualEnNameInput"
                                    placeholder="例如：Cyber Dragon"
                                    autocomplete="off"
                                    spellcheck="false"
                                />
                                <p id="manualEnNameHint" class="field-hint">
                                    空格和标点会自动移除，该名称将用于本地化键和脚本文件名。
                                </p>
                            </div>
                            <div class="panel-actions">
                                <button id="genLocaleBtn" class="btn-secondary" disabled>生成本地化</button>
                            </div>
                        </div>

                        <!-- 卡图裁剪 -->
                        <div class="crop-panel">
                            <h3>卡图裁剪 <span id="cropStatus" class="status-badge"></span></h3>
                            <div id="cropContainer" class="crop-container hidden">
                                <div class="crop-wrapper">
                                    <canvas id="cropCanvas"></canvas>
                                    <div class="crop-overlay">
                                        <div class="crop-frame"></div>
                                    </div>
                                </div>
                                <p class="crop-hint">鼠标滚轮缩放，拖拽移动，将需要的部分对准裁剪框</p>
                                <div class="crop-controls">
                                    <button id="resetCropBtn" class="btn-secondary">重置视图</button>
                                    <button id="generateCardBtn" class="btn-primary">生成卡牌</button>
                                </div>
                            </div>
                            <div id="noCardImage" class="no-resource">
                                <p>未找到外部卡图</p>
                            </div>
                        </div>

                        <!-- 立绘信息 -->
                        <div class="portrait-panel">
                            <h3>立绘 <span id="portraitStatus" class="status-badge"></span></h3>
                            <div id="portraitPreview" class="portrait-preview hidden">
                                <img id="portraitImg" src="" alt="立绘预览">
                            </div>
                            <div id="noPortrait" class="no-resource">
                                <p>未找到外部立绘</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 卡牌列表模块 -->
            <section id="library-tab" class="tab-content">
                <div class="card-list">
                    <div class="section-header">
                        <h2>已添加卡牌</h2>
                        <div class="actions">
                            <button id="refreshBtn" class="btn-secondary">刷新列表</button>
                            <button id="generateLocaleBtn" class="btn-secondary">生成本地化</button>
                            <button id="exportCardsBtn" class="btn-secondary">生成卡牌数据</button>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table class="cards-table">
                            <thead>
                                <tr>
                                    <th class="col-image">图片</th>
                                    <th class="col-id">ID</th>
                                    <th>标题</th>
                                    <th class="col-archetypes">字段</th>
                                    <th class="col-status">卡图</th>
                                    <th class="col-status">本地化</th>
                                    <th class="col-status">卡牌数据</th>
                                    <th class="col-status">卡牌立绘</th>
                                    <th class="col-status">卡牌场景</th>
                                    <th class="col-status">怪兽脚本</th>
                                    <th class="col-status">卡牌脚本</th>
                                    <th class="col-actions">操作</th>
                                </tr>
                            </thead>
                            <tbody id="cardsTableBody">
                                <tr>
                                    <td colspan="12" class="empty-cell">暂无卡牌数据</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="cardsPagination" class="pagination hidden">
                        <button id="prevCardsPageBtn" class="btn-secondary">上一页</button>
                        <span id="cardsPageInfo" class="page-info">第 1 / 1 页</span>
                        <button id="nextCardsPageBtn" class="btn-secondary">下一页</button>
                    </div>
                </div>
            </section>

            <!-- 配置中心模块 -->
            <section id="config-tab" class="tab-content">
                <div class="config-section">
                    <h2>外部资源目录</h2>
                    <div class="dir-form">
                        <input type="text" id="dirPath" placeholder="目录路径 (如: D:/YGOImages)" />
                        <select id="dirType">
                            <option value="card_image">卡图</option>
                            <option value="portrait">立绘</option>
                            <option value="other">其他</option>
                        </select>
                        <input type="number" id="dirPriority" placeholder="优先级" value="0" />
                        <input type="text" id="dirDesc" placeholder="描述" />
                        <button id="addDirBtn">添加目录</button>
                    </div>
                    <div id="dirsList" class="dirs-list">
                        <!-- 目录列表 -->
                    </div>
                </div>

                <div class="config-section">
                    <h2>项目设置</h2>
                    <div class="settings-form">
                        <label>
                            Mod ID:
                            <input type="text" id="modId" />
                        </label>
                        <label>
                            本地化前缀:
                            <input type="text" id="localePrefix" />
                        </label>
                        <button id="saveSettingsBtn">保存设置</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <dialog id="cardScriptDialog" class="script-dialog">
        <form id="cardScriptForm">
            <div class="dialog-header">
                <h2>添加卡牌脚本</h2>
                <button id="closeCardScriptDialogBtn" type="button" class="dialog-close" aria-label="关闭">×</button>
            </div>
            <p id="cardScriptCardInfo" class="dialog-card-info"></p>
            <label class="dialog-field">
                <span>卡池</span>
                <select id="cardScriptPool" required></select>
            </label>
            <label class="dialog-field">
                <span>文件夹</span>
                <input id="cardScriptFolder" type="text" readonly>
            </label>
            <div class="dialog-actions">
                <button id="cancelCardScriptBtn" type="button" class="btn-secondary">取消</button>
                <button id="submitCardScriptBtn" type="submit" class="btn-primary">创建脚本</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast hidden"></div>

    <script src="/js/app.js"></script>
</body>
</html>
